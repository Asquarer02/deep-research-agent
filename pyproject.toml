[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A multi-agent deep research assistant with a Gradio UI, built on the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.33.1",
    "openai-agents>=0.0.17",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "sendgrid>=6.12.3",
]

[project.scripts]
deep-research = "deep_research_agent.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research_agent"]
